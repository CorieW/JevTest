# Verify one package without workspaces or private dependencies.
name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Restrict main promotions
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        shell: bash
        env:
          EXPECTED_REPOSITORY: ${{ github.repository }}
          SOURCE_BRANCH: ${{ github.head_ref }}
          SOURCE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [[ "$SOURCE_BRANCH" != "next" || "$SOURCE_REPOSITORY" != "$EXPECTED_REPOSITORY" ]]; then
            echo "::error::main only accepts pull requests from next in this repository."
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm verify
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: test-evidence
          path: artifacts/
          retention-days: 7
